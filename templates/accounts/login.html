{% extends "base.html" %}
{% block title %}Login · MediCare{% endblock %}
{% block content %}

<div class="page-header" style="text-align:center;">
  <h1>Welcome Back</h1>
  <p>Log in to manage your appointments.</p>
</div>

<div class="card form-card">
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-block">Login</button>
  </form>
  <p class="auth-links">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
</div>

{% endblock %}
