{% extends "base.html" %}
{% block title %}Sign Up · MediCare{% endblock %}
{% block content %}

<div class="page-header" style="text-align:center;">
  <h1>Create Your Account</h1>
  <p>Book appointments with our doctors in minutes.</p>
</div>

<div class="card form-card">
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-block">Sign Up</button>
  </form>
  <p class="auth-links">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>

{% endblock %}
